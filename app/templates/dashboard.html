<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch NMS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='3' fill='%232DD4BF'/%3E%3Ccircle cx='12' cy='12' r='8' fill='none' stroke='%232DD4BF' stroke-width='1.5' opacity='0.5'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <header class="topbar">
        <h1>NetWatch <span class="accent">NMS</span></h1>
        <div class="topbar-actions">
            <button class="btn-secondary"
                    hx-get="/scan/new"
                    hx-target="#scan-container"
                    hx-swap="innerHTML"
                    onclick="document.getElementById('scan-modal').classList.remove('hidden')">
                Scan Network
            </button>
            <button class="btn-primary"
                    hx-get="/devices/new"
                    hx-target="#device-form-container"
                    hx-swap="innerHTML"
                    onclick="document.getElementById('add-device-modal').classList.remove('hidden')">
                + Add Device
            </button>
            <a href="/logout" class="btn-secondary logout-link">Logout</a>
        </div>
    </header>

    <main class="container">
        <!-- Live status grid — polls itself every 5s via HTMX, no page reload -->
        <div id="device-grid"
             hx-get="/partials/device-grid"
             hx-trigger="load, every 5s"
             hx-swap="innerHTML">
            <p class="muted">Loading devices…</p>
        </div>
    </main>

    <!-- Add/Edit Device modal — its inner form is swapped depending on which button was clicked -->
    <div id="add-device-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Device</h2>
            <div id="device-form-container">
                <!-- filled by /devices/new or /devices/{id}/edit -->
            </div>
        </div>
    </div>

    <!-- Scan Network modal -->
    <div id="scan-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Scan Network</h2>
            <div id="scan-container">
                <!-- filled by /scan/new -->
            </div>
        </div>
    </div>

    <script>
        document.body.addEventListener('htmx:afterRequest', function (evt) {
            // Only the create/update form submission should potentially close the modal —
            // not the GET requests that load the form into it, and not the device-grid poll.
            if (evt.detail.elt.id === 'device-form' && evt.detail.successful) {
                var errorEl = document.getElementById('form-error');
                var hasError = errorEl && errorEl.textContent.trim().length > 0;
                if (!hasError) {
                    document.getElementById('add-device-modal').classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
