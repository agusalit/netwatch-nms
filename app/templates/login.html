<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch NMS — Login</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='3' fill='%232DD4BF'/%3E%3Ccircle cx='12' cy='12' r='8' fill='none' stroke='%232DD4BF' stroke-width='1.5' opacity='0.5'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>NetWatch <span class="accent">NMS</span></h1>
        <form method="post" action="/login">
            <label for="field-username">Username</label>
            <input id="field-username" type="text" name="username" required autofocus>
            <label for="field-password">Password</label>
            <input id="field-password" type="password" name="password" required>
            {% if error %}
            <p class="login-error" role="alert">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn-primary login-submit">Log In</button>
        </form>
    </div>
</body>
</html>
