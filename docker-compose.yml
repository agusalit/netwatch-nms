services:
  netwatch:
    build: .
    container_name: netwatch-nms
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/data/netwatch.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
