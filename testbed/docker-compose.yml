# Simulated network for the hybrid ICMP + SNMP setup: three nodes with real
# SNMP agents. SNMP ports are published on loopback only (1161-1163), because
# a published UDP port is the one address NetWatch can reach whether Docker
# runs natively in WSL or through Docker Desktop.
name: netwatch-testbed

x-node: &node
  image: netwatch-testbed-node:latest
  build: .
  cap_add:
    - NET_ADMIN        # lets scenario.py add packet loss / latency with tc netem
  networks: [testbed]
  restart: unless-stopped

services:
  node1:
    <<: *node
    container_name: nw-node1
    hostname: testbed-node1
    ports: ["127.0.0.1:1161:161/udp"]
  node2:
    <<: *node
    container_name: nw-node2
    hostname: testbed-node2
    ports: ["127.0.0.1:1162:161/udp"]
  node3:
    <<: *node
    container_name: nw-node3
    hostname: testbed-node3
    ports: ["127.0.0.1:1163:161/udp"]

networks:
  testbed:
    driver: bridge
